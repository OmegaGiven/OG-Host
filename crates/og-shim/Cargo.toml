[package]
name = "og-shim"
description = "Per-container supervisor for OG-Host: creates/starts the container with libcontainer, reaps it, relays signals, records the exit"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
libc = "0.2"
libcontainer = { version = "0.7.0", default-features = false, features = ["v2", "libseccomp", "cgroupsv2_devices"] }
