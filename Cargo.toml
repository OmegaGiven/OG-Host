[workspace]
resolver = "2"
members = ["crates/og-oci", "crates/og-runtime", "crates/og-net", "crates/og-compose", "crates/og-shim", "crates/og-hostd", "crates/og-lab", "crates/og-access", "crates/og-backup"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/OmegaGiven/og-host"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
zstd = "0.13"
tar = "0.4"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Security fixes for exec (see vendor/libcontainer/OG-HOST-PATCHES.md)
[patch.crates-io]
libcontainer = { path = "vendor/libcontainer" }
